<!DOCTYPE html>
<html>

<head>

<title>Generate Question Paper</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container">


<h1>Generate Question Paper</h1>


<form action="/generate" method="POST">


<label>
Regulation
</label>

<select name="regulation">

<option value="2021">2021</option>

<option value="2025">2025</option>

</select>



<label>
Department
</label>

<select name="department">

<option value="CSE">CSE</option>

<option value="AIML">AIML</option>

</select>



<label>
Subject Code
</label>

<input 
type="text"
name="subject_code"
placeholder="Example: CS3491"
required
>


<button type="submit">

Generate

</button>


</form>


<br>


<a href="/" class="btn">
⬅ Back to Home
</a>


</div>


</body>

</html>
